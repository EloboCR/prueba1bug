# TEMPLATE — CBS Ruleset Parser Differential Probe
# Controlled Boundary Suite · GitHub Bug Bounty
#
# PURPOSE: Test if GitHub Actions trigger evaluates branches with Unicode normalization.
# The trigger is explicitly targeting the NFC branch name. If we push to the NFD branch,
# will this workflow trigger?
name: cbs-200a176f-parser-differential

on:
  push:
    branches:
      - 'release-200a176f-café'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report trigger evaluation
        shell: bash
        run: |
          set -euo pipefail
          REF_LEN=$(printf '%s' "$GITHUB_REF_NAME" | wc -c | tr -d ' ')
          REF_HEX=$(printf '%s' "$GITHUB_REF_NAME" | xxd -p | tr -d '\n')
          
          printf 'CBS_TRIGGER_REF_NAME=%s\n' "${GITHUB_REF_NAME}"
          printf 'CBS_TRIGGER_REF_HEX=%s\n' "$REF_HEX"
          printf 'CBS_TRIGGER_REF_LEN=%s\n' "$REF_LEN"
          printf 'CBS_TRIGGER_RUN_ID=%s\n' "${GITHUB_RUN_ID}"
          printf 'CBS_TRIGGER_SHA=%s\n' "${GITHUB_SHA}"

          if [[ "$REF_LEN" == "22" ]]; then
            printf 'CBS_TRIGGER_ORIGIN=NFC_EXPECTED\n'
          elif [[ "$REF_LEN" == "23" ]]; then
            printf 'CBS_TRIGGER_ORIGIN=NFD_UNEXPECTED_NORMALIZATION\n'
          else
            printf 'CBS_TRIGGER_ORIGIN=UNKNOWN\n'
          fi
