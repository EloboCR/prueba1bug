name: cbs-7b82032b-refcap
on:
  push:
    branches:
      - 'cbs-*'
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Capture GITHUB_REF_NAME
        run: |
          echo "::group::CBS Ref Capture"
          echo "CBS_REFCAP_RUN_ID=7b82032b"
          echo "CBS_REF=$GITHUB_REF"
          echo "CBS_REF_NAME=$GITHUB_REF_NAME"
          printf 'CBS_REF_NAME_HEX='
          printf '%s' "$GITHUB_REF_NAME" | xxd -p
          echo ''
          printf 'CBS_REF_HEX='
          printf '%s' "$GITHUB_REF" | xxd -p
          echo ''
          echo "CBS_REF_NAME_LEN=$(printf '%s' "$GITHUB_REF_NAME" | wc -c | tr -d ' ')"
          echo "::endgroup::"
