# TEMPLATE — CBS Cache Unicode Normalization Probe v2
# Controlled Boundary Suite · GitHub Bug Bounty
#
# PURPOSE: Test whether GitHub Actions cache scope boundary normalizes Unicode
#          branch names. A single workflow with two mutually exclusive jobs:
#          - Producer: runs ONLY on the NFD branch (byte-length gate)
#          - Consumer: runs ONLY on the NFC branch (byte-length gate)
#
# ISOLATION MECHANISM: Each job's first step computes the byte-length of
#   GITHUB_REF_NAME. Since NFC é = 2 bytes (c3a9) and NFD é = 3 bytes
#   (65 cc81), the branch names differ by exactly 1 byte. The gate verifies
#   the expected byte-length and sets a GITHUB_OUTPUT flag. All subsequent
#   steps are conditioned on that flag.
#
# PROVENANCE: The producer embeds a locally-generated nonce (65dd0155da2bcfd5310fed25b3c1159f)
#   inside the cached payload. The consumer verifies the nonce AND checks
#   that the producer's ref hex contains NFD bytes (cc81) before declaring
#   a confirmed cross-scope cache hit.
#
# SAFETY: No secrets, no OIDC, no checkout of untrusted code.
#   Payload is a text file with run metadata. Cache key is unique per run.
name: cbs-411b2cfc-cache-v2

on:
  push:
    branches:
      - 'release-411b2cfc-*'

permissions:
  contents: read

jobs:
  producer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Byte-length gate (NFD only)
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          REF_LEN=$(printf '%s' "$GITHUB_REF_NAME" | wc -c | tr -d ' ')
          REF_HEX=$(printf '%s' "$GITHUB_REF_NAME" | xxd -p | tr -d '\n')
          printf 'CBS_GATE_JOB=producer\n'
          printf 'CBS_GATE_REF_LEN=%s\n' "$REF_LEN"
          printf 'CBS_GATE_REF_HEX=%s\n' "$REF_HEX"
          if [[ "$REF_LEN" != "23" ]]; then
            printf 'CBS_GATE_RESULT=SKIP (expected 23 bytes for NFD, got %s)\n' "$REF_LEN"
            echo "role_match=false" >> "$GITHUB_OUTPUT"
          else
            printf 'CBS_GATE_RESULT=MATCH (NFD producer, %s bytes)\n' "$REF_LEN"
            echo "role_match=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create provenance payload
        if: steps.gate.outputs.role_match == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .elobo-cache-probe
          REF_HEX=$(printf '%s' "$GITHUB_REF_NAME" | xxd -p | tr -d '\n')

          printf 'NONCE=65dd0155da2bcfd5310fed25b3c1159f\n'                            >  .elobo-cache-probe/payload.txt
          printf 'PRODUCER_RUN_ID=%s\n' "${GITHUB_RUN_ID}"      >> .elobo-cache-probe/payload.txt
          printf 'PRODUCER_REF=%s\n' "${GITHUB_REF}"            >> .elobo-cache-probe/payload.txt
          printf 'PRODUCER_REF_NAME=%s\n' "${GITHUB_REF_NAME}"  >> .elobo-cache-probe/payload.txt
          printf 'PRODUCER_REF_NAME_HEX=%s\n' "$REF_HEX"       >> .elobo-cache-probe/payload.txt
          printf 'PRODUCER_SHA=%s\n' "${GITHUB_SHA}"            >> .elobo-cache-probe/payload.txt

          PAYLOAD_SHA256=$(sha256sum .elobo-cache-probe/payload.txt | cut -d' ' -f1)

          printf 'CBS_PRODUCER_NONCE=65dd0155da2bcfd5310fed25b3c1159f\n'
          printf 'CBS_PRODUCER_RUN_ID=%s\n' "${GITHUB_RUN_ID}"
          printf 'CBS_PRODUCER_REF_NAME_HEX=%s\n' "$REF_HEX"
          printf 'CBS_PRODUCER_SHA=%s\n' "${GITHUB_SHA}"
          printf 'CBS_PRODUCER_PAYLOAD_SHA256=%s\n' "$PAYLOAD_SHA256"

      - name: Save cache
        if: steps.gate.outputs.role_match == 'true'
        uses: actions/cache/save@v4
        with:
          path: .elobo-cache-probe
          key: cbs-cache-411b2cfc

      - name: Report
        if: steps.gate.outputs.role_match == 'true'
        shell: bash
        run: |
          printf 'CBS_PRODUCER_STATUS=CACHE_SAVED\n'
          printf 'CBS_CACHE_KEY=cbs-cache-411b2cfc\n'
          printf 'CBS_PRODUCER_STATUS=CACHE_SAVED\n' >> "$GITHUB_STEP_SUMMARY"

  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Byte-length gate (NFC only)
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          REF_LEN=$(printf '%s' "$GITHUB_REF_NAME" | wc -c | tr -d ' ')
          REF_HEX=$(printf '%s' "$GITHUB_REF_NAME" | xxd -p | tr -d '\n')
          printf 'CBS_GATE_JOB=consumer\n'
          printf 'CBS_GATE_REF_LEN=%s\n' "$REF_LEN"
          printf 'CBS_GATE_REF_HEX=%s\n' "$REF_HEX"
          if [[ "$REF_LEN" != "22" ]]; then
            printf 'CBS_GATE_RESULT=SKIP (expected 22 bytes for NFC, got %s)\n' "$REF_LEN"
            echo "role_match=false" >> "$GITHUB_OUTPUT"
          else
            printf 'CBS_GATE_RESULT=MATCH (NFC consumer, %s bytes)\n' "$REF_LEN"
            echo "role_match=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt cache restore
        if: steps.gate.outputs.role_match == 'true'
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: .elobo-cache-probe
          key: cbs-cache-411b2cfc

      - name: Evaluate provenance
        if: steps.gate.outputs.role_match == 'true'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_NONCE="65dd0155da2bcfd5310fed25b3c1159f"

          CONSUMER_REF_HEX=$(printf '%s' "${GITHUB_REF_NAME}" | xxd -p | tr -d '\n')
          CONSUMER_REF_LEN=$(printf '%s' "$GITHUB_REF_NAME" | wc -c | tr -d ' ')
          printf 'CBS_CONSUMER_REF_NAME_HEX=%s\n' "$CONSUMER_REF_HEX"
          printf 'CBS_CONSUMER_REF_LEN=%s\n' "$CONSUMER_REF_LEN"
          printf 'CBS_CONSUMER_RUN_ID=%s\n' "${GITHUB_RUN_ID}"
          printf 'CBS_CONSUMER_SHA=%s\n' "${GITHUB_SHA}"

          CACHE_HIT='${{ steps.restore.outputs.cache-hit }}'
          MATCHED_KEY='${{ steps.restore.outputs.cache-matched-key }}'
          printf 'CBS_CACHE_HIT=%s\n' "$CACHE_HIT"
          printf 'CBS_CACHE_MATCHED_KEY=%s\n' "$MATCHED_KEY"

          if [[ "$CACHE_HIT" == 'true' ]] && [[ -f .elobo-cache-probe/payload.txt ]]; then
            # Extract provenance fields from restored payload
            RESTORED_NONCE=$(grep '^NONCE=' .elobo-cache-probe/payload.txt | head -1 | cut -d= -f2 || echo "EXTRACTION_FAILED")
            RESTORED_REF_HEX=$(grep '^PRODUCER_REF_NAME_HEX=' .elobo-cache-probe/payload.txt | head -1 | cut -d= -f2 || echo "EXTRACTION_FAILED")
            RESTORED_RUN_ID=$(grep '^PRODUCER_RUN_ID=' .elobo-cache-probe/payload.txt | head -1 | cut -d= -f2 || echo "EXTRACTION_FAILED")
            RESTORED_SHA=$(grep '^PRODUCER_SHA=' .elobo-cache-probe/payload.txt | head -1 | cut -d= -f2 || echo "EXTRACTION_FAILED")
            PAYLOAD_SHA256=$(sha256sum .elobo-cache-probe/payload.txt | cut -d' ' -f1)

            printf 'CBS_RESTORED_NONCE=%s\n' "$RESTORED_NONCE"
            printf 'CBS_RESTORED_PRODUCER_REF_HEX=%s\n' "$RESTORED_REF_HEX"
            printf 'CBS_RESTORED_PRODUCER_RUN_ID=%s\n' "$RESTORED_RUN_ID"
            printf 'CBS_RESTORED_PRODUCER_SHA=%s\n' "$RESTORED_SHA"
            printf 'CBS_RESTORED_PAYLOAD_SHA256=%s\n' "$PAYLOAD_SHA256"

            # Verify nonce
            if [[ "$RESTORED_NONCE" == "$EXPECTED_NONCE" ]]; then
              # Verify origin was NFD branch (hex contains cc81 — combining acute)
              if echo "$RESTORED_REF_HEX" | grep -qi "cc81"; then
                printf 'CBS_CONSUMER_VERDICT=UNEXPECTED_CACHE_HIT__NONCE_VERIFIED\n'
                printf 'CBS_CONSUMER_VERDICT=UNEXPECTED_CACHE_HIT__NONCE_VERIFIED\n' >> "$GITHUB_STEP_SUMMARY"
                printf 'CONFIRMED: NFC consumer restored payload from NFD producer. Nonce match + NFD origin verified.\n' >> "$GITHUB_STEP_SUMMARY"
                exit 1
              else
                printf 'CBS_CONSUMER_VERDICT=UNEXPECTED_CACHE_HIT__NONCE_OK_BUT_NOT_NFD_ORIGIN\n'
                printf 'Nonce matches but producer ref hex does not contain cc81 (NFD).\n'
                printf 'Producer ref hex: %s\n' "$RESTORED_REF_HEX"
                exit 1
              fi
            else
              printf 'CBS_CONSUMER_VERDICT=UNEXPECTED_CACHE_HIT__NONCE_MISMATCH\n'
              printf 'Expected nonce: %s\n' "$EXPECTED_NONCE"
              printf 'Restored nonce: %s\n' "$RESTORED_NONCE"
              exit 1
            fi
          elif [[ "$CACHE_HIT" == 'true' ]]; then
            printf 'CBS_CONSUMER_VERDICT=UNEXPECTED_CACHE_HIT__NO_PAYLOAD_FILE\n'
            exit 1
          else
            printf 'CBS_CONSUMER_VERDICT=EXPECTED_CACHE_MISS\n'
            printf 'CBS_CONSUMER_VERDICT=EXPECTED_CACHE_MISS\n' >> "$GITHUB_STEP_SUMMARY"
            printf 'Cache scope isolation intact: NFC consumer could not read NFD producer cache.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
