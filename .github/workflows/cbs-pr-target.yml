name: cbs-pr-target-observer
on:
  pull_request_target:
    types: [opened]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Record safe context
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf "event=%s\nbase_ref=%s\nhead_ref=%s\nbase_sha=%s\nhead_sha=%s\n" "$EVENT" "$BASE_REF" "$HEAD_REF" "$BASE_SHA" "$HEAD_SHA"
